<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#faf6ef" />
    <!-- <title> and meta description come from each page's <Seo> (React 19 places them in <head>) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Habesha Leather Crafts" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300..600&display=swap"
    />
    <script>
      // scroll reveals only hide content once we know JavaScript is running
      document.documentElement.classList.add('js')
      // apply the theme before first paint, so dark mode never flashes light:
      // light is the default; dark only when the visitor has chosen it
      try {
        if (localStorage.getItem('hlc.theme') === 'dark') {
          document.documentElement.classList.add('dark')
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#17110c')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
